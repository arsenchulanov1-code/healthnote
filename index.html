      const dx=p.x-mx, dy=p.y-my, d2=dx*dx+dy*dy; if(d2<16000){ p.x+=dx*.012; p.y+=dy*.012; } }
    c.lineWidth=1;

      for(let j=i+1;j<pts.length;j++){ const b=pts[j], dx=a.x-b.x, dy=a.y-b.y, d=dx*dx+dy*dy; if(d<19600){ c.strokeStyle=`rgba(61,123,255,${(.16*(1-d/19600)).toFixed(3)})`; c.beginPath(); c.moveTo(a.x,a.y); c.lineTo(b.x,b.y); c.stroke(); } }
      c.fillStyle='rgba(111,160,255,.45)'; c.beginPath(); c.arc(a.x,a.y,1.3,0,6.283); c.fill(); }

/* hero: pointer parallax on three depths + a soft spotlight */
if(fine && !reduced){
  const hero=$('hero'); let tx=0,ty=0,x=0,y=0,raf=0;
  const step=()=>{ x+=(tx-x)*.07; y+=(ty-y)*.07; hero.style.setProperty('--hx',x.toFixed(4)); hero.style.setProperty('--hy',y.toFixed(4));
    raf=(Math.abs(tx-x)>.0005||Math.abs(ty-y)>.0005)?requestAnimationFrame(step):0; };
  hero.addEventListener('pointermove',e=>{ const r=hero.getBoundingClientRect(); tx=(e.clientX-r.left)/r.width-.5; ty=(e.clientY-r.top)/r.height-.5;
    hero.style.setProperty('--sx',(e.clientX-r.left).toFixed(0)+'px'); hero.style.setProperty('--sy',(e.clientY-r.top).toFixed(0)+'px'); hero.style.setProperty('--so','1');
    if(!raf) raf=requestAnimationFrame(step); });
  hero.addEventListener('pointerleave',()=>{ tx=ty=0; hero.style.setProperty('--so','0'); if(!raf) raf=requestAnimationFrame(step); });
}

/* scroll-driven: quote words, demo card swing, next-page titles and footer wordmark drift, marquee that follows scroll direction */
if(!reduced){
  const stage=$('stage'), nps=[...document.querySelectorAll('.nextpage')], fw=document.querySelector('.foot-word');
  const vis=r=>r.bottom>0 && r.top<innerHeight && r.height>0;
  function onScrollFx(){
    const vh=innerHeight;
    if(quoteEl){ const r=quoteEl.getBoundingClientRect(); if(vis(r)) quoteEl.style.setProperty('--q',clamp01((vh*.88-r.top)/(r.height+vh*.42)).toFixed(4)); }
    if(stage){ const r=stage.getBoundingClientRect(); if(vis(r)){ const p=clamp01((vh-r.top)/(vh*.75)), e=1-Math.pow(1-p,3);
      stage.style.setProperty('--dx',((1-e)*22).toFixed(2)+'deg'); stage.style.setProperty('--ds',(.88+.12*e).toFixed(4)); } }
    nps.forEach(n=>{ const r=n.getBoundingClientRect(); if(vis(r)) n.style.setProperty('--npx',((r.top+r.height/2-vh/2)*.18).toFixed(1)+'px'); });
    if(fw){ const r=fw.getBoundingClientRect(); if(vis(r)) fw.style.setProperty('--fwx',((r.top-vh)*.12).toFixed(1)+'px'); }
  }
  let sr=0; addEventListener('scroll',()=>{ if(!sr) sr=requestAnimationFrame(()=>{ sr=0; onScrollFx(); }); },{passive:true});
  addEventListener('resize',onScrollFx); addEventListener('hashchange',()=>setTimeout(onScrollFx,1200));
  onScrollFx();

  const track=$('track'), mqEl=document.querySelector('.marquee');
  if(track && mqEl){
    let x=0, dir=1, boost=0, ly=scrollY, on=false, raf=0, last=0;
    addEventListener('scroll',()=>{ const d=scrollY-ly; ly=scrollY; if(d) dir=d>0?1:-1; boost=Math.min(14,boost+Math.abs(d)*.08); },{passive:true});
    const loop=now=>{ const dt=Math.min(50,now-(last||now)); last=now; boost*=.93;
      const half=track.scrollWidth/2; x-=dir*(.045*dt+boost); if(half){ x%=half; if(x>0) x-=half; }
      track.style.transform=`translate3d(${x.toFixed(1)}px,0,0)`; raf=on&&!document.hidden?requestAnimationFrame(loop):0; };
    new IntersectionObserver(es=>{ on=es[0].isIntersecting; if(on && !raf){ last=0; raf=requestAnimationFrame(loop); } }).observe(mqEl);
    document.addEventListener('visibilitychange',()=>{ if(on && !document.hidden && !raf){ last=0; raf=requestAnimationFrame(loop); } });
  }
}

/* preloader: counts with real readiness (fonts + window load), never shorter than ~1.4 s, any click or key skips */
(function preload(){
  const pl=$('preloader');
  if(!root.classList.contains('preloading')){ root.classList.add('intro'); return; }
  const PM={ru:['Загружаем медкарту','Нажмите, чтобы пропустить'],en:['Loading medical ID','Click to skip'],kk:['Медкарта жүктелуде','Өткізу үшін басыңыз']};
  $('plMsg').textContent=(PM[lang]||PM.en)[0]; $('plSkip').textContent=(PM[lang]||PM.en)[1];
  const panel=pl.querySelector('.pl-panel'), num=$('plNum'); let p=0, ready=false, done=false; const t0=performance.now();
  const loaded=new Promise(r=>document.readyState==='complete'?r():addEventListener('load',r,{once:true}));
  Promise.race([Promise.all([loaded,document.fonts?document.fonts.ready:null]),new Promise(r=>setTimeout(r,4500))]).then(()=>{ ready=true; });
  const skip=()=>{ ready=true; p=Math.max(p,.97); };
  pl.addEventListener('click',skip); addEventListener('keydown',e=>{ if(!done && /^(Escape|Enter| )$/.test(e.key)) skip(); });
  function tick(now){
    const el=now-t0, goal=Math.min(ready?1:.9, el/1400);
    p+=(goal-p)*.09+(goal>p?.002:0); p=Math.min(p,goal);
    num.textContent=String(Math.round(p*100)).padStart(3,'0');
    panel.style.setProperty('--pl-o',(1-p).toFixed(4)); panel.style.setProperty('--pl-p',p.toFixed(4));
    if(p>=.999) finish(); else requestAnimationFrame(tick);
  }
  requestAnimationFrame(tick);
  function finish(){
    if(done) return; done=true; num.textContent='100';
    const E='cubic-bezier(.76,0,.24,1)';
    panel.querySelector('.pl-mid').animate([{transform:'none',opacity:1},{transform:'translateY(-70px)',opacity:0}],{duration:520,delay:120,easing:E,fill:'forwards'});
    panel.animate([{clipPath:'inset(0 0 0 0)'},{clipPath:'inset(0 0 100% 0)'}],{duration:900,delay:300,easing:E,fill:'forwards'});
    const b=pl.querySelector('.pl-bg').animate([{clipPath:'inset(0 0 0 0)'},{clipPath:'inset(0 0 100% 0)'}],{duration:900,delay:470,easing:E,fill:'forwards'});
    setTimeout(()=>{ root.classList.remove('preloading'); root.classList.add('intro'); },820);
    b.finished.then(()=>{ pl.hidden=true; });
  }
})();

const _apply5=applyLang; applyLang=function(a){ scr.forEach(clearInterval); scr.clear(); _apply5(a); splitHero(); splitQuote(); if(a) document.querySelectorAll('.kicker,.np-k').forEach(k=>{ k._s=k.textContent; }); };

/*V6JS*/
/* ================= v6: smooth scroll, pinned scenes, nav pill, fitted headline ================= */
const G=window.gsap, ST=window.ScrollTrigger;
if(G && ST){ G.registerPlugin(ST); ST.config({ignoreMobileResize:true}); }

/* Lenis: inertial wheel scrolling for mouse users; touch keeps the native feel. Everything still runs on the real scroll position */
let lenis=null;
if(window.Lenis && fine && !reduced){
  try{ lenis=new Lenis({duration:1.05,smoothWheel:true}); }catch(e){ lenis=null; }
  if(lenis){
    if(G && ST){ lenis.on('scroll',ST.update); G.ticker.add(tm=>lenis.raf(tm*1000)); G.ticker.lagSmoothing(0); }
    else (function raf(tm){ lenis.raf(tm); requestAnimationFrame(raf); })(performance.now());
    if(root.classList.contains('preloading')) lenis.stop();
    document.querySelectorAll('.mnav,textarea,select').forEach(el=>el.setAttribute('data-lenis-prevent',''));
  }
}
function jump(y,smooth){ if(lenis){ lenis.resize(); lenis.scrollTo(y,{immediate:!smooth,force:true,duration:1.2}); } else scrollTo({top:y,behavior:smooth?'smooth':'instant'}); }
// pinned scenes are measured while their page is hidden; re-measure before the target position is read
function preSwap(){ fitTitle(); if(ST) ST.refresh(); }
// web fonts change heights after the first paint: land on the target again once things settle (unless the reader has already moved)
function afterSwap(pg,el){
  if(lenis) lenis.resize();
  if(!el || el===pg.firstElementChild || el.contains(pg.firstElementChild)) return;
  let moved=false; const mark=()=>{ moved=true; }; addEventListener('wheel',mark,{once:true,passive:true}); addEventListener('touchmove',mark,{once:true,passive:true}); addEventListener('keydown',mark,{once:true});
  const fix=()=>{ if(moved || curPage!==pg.dataset.page) return; const y=Math.max(0,el.getBoundingClientRect().top+scrollY-84); if(Math.abs(y-scrollY)>6) jump(y,false); };
  setTimeout(fix,350); if(document.fonts && document.fonts.status!=='loaded') document.fonts.ready.then(()=>setTimeout(fix,120));
}

/* in-page links: one path for every anchor, so smooth scrolling and page wipes never fight the browser's own jump */
document.addEventListener('click',e=>{
  const a=e.target.closest && e.target.closest('a[href^="#"]');
  if(!a || e.defaultPrevented || e.metaKey || e.ctrlKey || e.shiftKey || a.classList.contains('skip')) return;
  const h=a.getAttribute('href'); if(h==='#' || /^#card-/.test(h)) return;
  e.preventDefault(); if(location.hash!==h) history.pushState(null,'',h); route();
});

/* hero headline: each line is set as large as the container allows (desktop); phones let it wrap */
const heroTitle=document.querySelector('.hero-title'), bigHero=matchMedia('(min-width:881px) and (min-height:561px)');
function fitTitle(){
  if(heroTitle) heroTitle.style.removeProperty('--h1fs'); return;   // one fixed size from the type scale, the same in every language
  if(!heroTitle) return;
  if(!bigHero.matches){ heroTitle.style.removeProperty('--h1fs'); return; }
  const wrap=heroTitle.parentElement, cs=getComputedStyle(wrap), avail=wrap.clientWidth-parseFloat(cs.paddingLeft)-parseFloat(cs.paddingRight);
  if(!(avail>0)) return;
  heroTitle.style.setProperty('--h1fs','100px'); let w=0;
  heroTitle.querySelectorAll(':scope > span').forEach(sp=>{ w=Math.max(w,sp.offsetWidth); });
  if(!w){ heroTitle.style.removeProperty('--h1fs'); return; }
  heroTitle.style.setProperty('--h1fs',Math.min(avail/w*100,innerHeight*.205,240).toFixed(1)+'px');
}
addEventListener('resize',fitTitle);
if(document.fonts && document.fonts.ready) document.fonts.ready.then(()=>{ fitTitle(); if(ST) ST.refresh(); });

/* once the intro has played, the question line drains to an outline; Lenis wakes up with the page */
(function afterIntro(){
  const go=()=>{ if(lenis) lenis.start(); setTimeout(()=>heroTitle && heroTitle.classList.add('drained'),reduced?0:1900); };
  if(!root.classList.contains('preloading')){ go(); return; }
  const mo=new MutationObserver(()=>{ if(!root.classList.contains('preloading')){ mo.disconnect(); go(); } });
  mo.observe(root,{attributes:true,attributeFilter:['class']});
})();

/* nav: one glass pill glides between links — to the one under the pointer, back to the current page */
let navPillSync=()=>{};
(function navPill(){
  const nav=document.querySelector('nav.links'), pill=nav && nav.querySelector('.nav-pill'); if(!pill) return;
  const to=a=>{ if(!a || !a.offsetWidth){ pill.style.setProperty('--po','0'); return; }
    pill.style.setProperty('--px',a.offsetLeft+'px'); pill.style.setProperty('--pw',a.offsetWidth+'px'); pill.style.setProperty('--po','1'); };
  const cur=()=>nav.querySelector('a[aria-current]');
  nav.addEventListener('pointerover',e=>{ const a=e.target.closest('a'); if(a) to(a); });
  nav.addEventListener('pointerleave',()=>to(cur()));
  nav.addEventListener('focusin',e=>{ const a=e.target.closest('a'); if(a) to(a); });
  nav.addEventListener('focusout',()=>to(cur()));
  navPillSync=()=>to(cur());
  addEventListener('resize',navPillSync);
})();

/* footer wordmark: letters stand up one after another */
const footWord=document.querySelector('.foot-word');
if(footWord){ const txt=footWord.textContent; footWord.textContent=''; [...txt].forEach(c=>{ const sp=document.createElement('span'); sp.className='fc'; sp.textContent=c; footWord.appendChild(sp); }); }

/* GSAP ScrollTrigger scenes */
if(G && ST && !reduced){
  // hero light drifts up as the bracelet comes apart
  G.to('.hero-aura',{yPercent:-12,ease:'none',scrollTrigger:{trigger:'#heroScroll',start:'top top',end:'bottom top',scrub:true}});
  // the wristband slides in and straightens
  G.fromTo('.stats',{xPercent:10,rotate:-1.8},{xPercent:0,rotate:0,ease:'none',scrollTrigger:{trigger:'#stats',start:'top bottom',end:'top 52%',scrub:.6}});
  // the white sheet grows out of the dark page
  document.querySelectorAll('.page[data-page="home"] .paper').forEach(p=>{
    G.fromTo(p,{scale:.9,y:80},{scale:1,y:0,ease:'none',scrollTrigger:{trigger:p,start:'top bottom',end:'top 50%',scrub:.5}});
  });
  if(footWord) G.from(footWord.children,{yPercent:108,duration:1.2,ease:'expo.out',stagger:.045,scrollTrigger:{trigger:footWord,start:'top 94%'}});
  // features: the section pins and its cards travel sideways (desktop only)
  const mm=G.matchMedia();
  mm.add('(min-width:1021px) and (min-height:620px)',()=>{
    const sec=$('features'), tr=sec.querySelector('.features'); sec.classList.add('hz-on'); tr.classList.add('hz');
    const dist=()=>Math.max(0,tr.offsetWidth-(tr.parentElement.clientWidth-parseFloat(getComputedStyle(tr.parentElement).paddingLeft)*2));
    G.to(tr,{x:()=>-dist(),ease:'none',scrollTrigger:{trigger:sec,pin:true,start:'top top',end:()=>'+='+Math.max(300,dist()),scrub:.8,invalidateOnRefresh:true,anticipatePin:1}});
    return ()=>{ sec.classList.remove('hz-on'); tr.classList.remove('hz'); G.set(tr,{clearProps:'transform'}); };
  });
}

const _apply6=applyLang; applyLang=function(a){ _apply6(a); fitTitle(); navPillSync(); if(a && ST) ST.refresh(); };
/*V6JS-END*/

render(true);
applyLang(false);
route();
})();
</script>
