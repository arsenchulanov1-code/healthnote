<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>HealthNote — медицинский браслет с QR‑кодом</title>
<meta name="description" content="HealthNote: браслет с QR‑кодом для людей, которые могут внезапно потерять сознание. Диагноз, первая помощь и номер близкого открываются камерой телефона за секунды.">
<meta name="theme-color" content="#05070D">
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fira+Sans+Extra+Condensed:wght@700;800;900&family=Onest:wght@400;500;600;700&display=swap">
<style>
/* Palette: smoky black + electric blue. Layout: sticky header → dark full-bleed hero (text | exploded 3D bracelet with callouts as background) → live card demo → marquee → count-up stats → about → spotlight features → lit steps → account workspace (form | QR) → FAQ */
:root{
  --bg:#E3F6EA;        /* mint milk */
  --surface:#FFFFFF;
  --ink:#24133F;       /* deep plum */
  --muted:#5D5476;
  --line:#CBE5D6;
  --jade:#00A878;      /* main green */
  --jade-strong:#00805B;
  --on-jade:#FFFFFF;
  --pink:#FF5F9E;      /* pop */
  --sun:#FFC93C;       /* butter */
  --lilac:#A68BFF;
  --soft:#D2F3E0;
  --danger:#C62828;
  --qr-bg:#FFFFFF; --qr-fg:#24133F;
  --shadow:0 2px 0 rgba(36,19,63,.06),0 20px 44px -22px rgba(36,19,63,.35);
  --f-display:"Montserrat","Segoe UI",system-ui,sans-serif;
  --f-logo:"Helvetica Neue",Helvetica,"Arimo",Arial,sans-serif;
  --f-body:"Nunito","Segoe UI",system-ui,-apple-system,sans-serif;
  --r-sm:10px; --r-md:16px; --r-lg:28px;
  --dur-fast:160ms; --dur:300ms; --ease:cubic-bezier(.2,.8,.2,1); --spring:cubic-bezier(.34,1.56,.64,1);
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0D1B21; --surface:#14282E; --ink:#ECFFF4; --muted:#A3BDB6; --line:#244149;
  --jade:#2EE6A6; --jade-strong:#7AF5C8; --on-jade:#05261B; --soft:#173A35;
  --pink:#FF7AB0; --sun:#FFD45E; --lilac:#B7A2FF; --danger:#FF8A80; --qr-fg:#24133F;
  --shadow:0 2px 0 rgba(0,0,0,.3),0 24px 50px -22px rgba(0,0,0,.8); color-scheme:dark;}}
:root[data-theme="dark"]{
  --bg:#0D1B21; --surface:#14282E; --ink:#ECFFF4; --muted:#A3BDB6; --line:#244149;
  --jade:#2EE6A6; --jade-strong:#7AF5C8; --on-jade:#05261B; --soft:#173A35;
  --pink:#FF7AB0; --sun:#FFD45E; --lilac:#B7A2FF; --danger:#FF8A80; --qr-fg:#24133F;
  --shadow:0 2px 0 rgba(0,0,0,.3),0 24px 50px -22px rgba(0,0,0,.8); color-scheme:dark;}

*,*::before,*::after{box-sizing:border-box}
[hidden]{display:none!important}
html{scroll-behavior:smooth;scroll-padding-top:84px;overflow-x:clip}
body{background:var(--bg);color:var(--ink);font:400 17px/1.6 var(--f-body);-webkit-font-smoothing:antialiased;overflow-x:clip;transition:background var(--dur),color var(--dur)}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
.wrap{max-width:1180px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
h1,h2,h3{font-family:var(--f-display);font-weight:700;line-height:1.1;text-wrap:balance;margin:0;letter-spacing:-.015em}
h2{font-size:clamp(28px,4.2vw,48px)}
h3{font-size:19px;font-weight:500;line-height:1.3}
p{margin:0}
a{color:var(--jade-strong)}
:focus-visible{outline:3px solid var(--pink);outline-offset:3px;border-radius:8px}
.lead{font-size:clamp(18px,2vw,21px);color:var(--muted);max-width:56ch}

/* buttons */
.btn{position:relative;display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:48px;padding:0 24px;border-radius:999px;border:2px solid transparent;font:700 15px/1 var(--f-display);cursor:pointer;text-decoration:none;transition:transform var(--dur) var(--spring),background var(--dur-fast),border-color var(--dur-fast),box-shadow var(--dur);will-change:transform}
.btn:active{transform:scale(.95)!important}
.btn-primary{background:var(--jade);color:var(--on-jade);box-shadow:0 6px 0 -1px var(--jade-strong)}
.btn-primary:hover{box-shadow:0 8px 0 -1px var(--jade-strong),0 14px 30px -10px var(--jade)}
.btn-pink{background:var(--pink);color:#2A0A1C;box-shadow:0 6px 0 -1px color-mix(in srgb,var(--pink) 60%,var(--ink))}
.btn-ghost{background:transparent;color:var(--ink);border-color:var(--line)}
.btn-ghost:hover{border-color:var(--jade);background:var(--soft)}
.btn-sm{min-height:40px;padding:0 16px;font-size:15px}
.icon-btn{width:40px;height:40px;display:grid;place-items:center;border-radius:12px;border:2px solid var(--line);background:var(--surface);color:var(--ink);cursor:pointer;transition:transform var(--dur) var(--spring),border-color var(--dur-fast)}
.icon-btn:hover{border-color:var(--jade);transform:rotate(-12deg)}
.icon-btn svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}

/* header */
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:color-mix(in srgb,var(--bg) 85%,transparent);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.top .wrap{display:flex;align-items:center;gap:16px;min-height:68px}
.progress{position:absolute;left:0;bottom:-1px;height:3px;width:100%;transform-origin:left;transform:scaleX(var(--p,0));background:linear-gradient(90deg,var(--jade),var(--sun),var(--pink))}
.logo{display:flex;align-items:center;gap:10px;font:400 22px/1 var(--f-logo);letter-spacing:-.04em;color:var(--ink);text-decoration:none}
.logo .name b{font-weight:700}
.logo .page{transform-origin:20px 22px;transition:transform var(--dur) var(--spring)}
.logo:hover .page{transform:rotate(-6deg) translateY(-1px)}
.logo .beat-line{stroke-dasharray:40;animation:logoline 2.8s var(--ease) infinite}
@keyframes logoline{0%{stroke-dashoffset:40}45%,100%{stroke-dashoffset:0}}
footer .logo{color:var(--bg);font-size:20px}
.logo svg{flex:none;transition:transform var(--dur) var(--spring)}
.logo:hover svg{transform:scale(1.06)}
nav.links{display:flex;gap:20px;margin-left:auto}
nav.links a{position:relative;color:var(--muted);text-decoration:none;font-weight:700;font-size:15px}
nav.links a::after{content:"";position:absolute;left:0;right:0;bottom:-4px;height:2px;border-radius:2px;background:var(--pink);transform:scaleX(0);transition:transform var(--dur) var(--ease)}
nav.links a:hover{color:var(--ink)}
nav.links a:hover::after{transform:scaleX(1)}
.tools{display:flex;align-items:center;gap:8px}
.lang{display:flex;padding:3px;border:2px solid var(--line);border-radius:12px;background:var(--surface)}
.lang button{border:0;background:transparent;color:var(--muted);font:800 13px var(--f-body);padding:6px 9px;border-radius:8px;cursor:pointer;transition:background var(--dur-fast),color var(--dur-fast)}
.lang button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
@media (max-width:1020px){nav.links{display:none}.tools{margin-left:auto}}
@media (max-width:560px){.top .cta-head{display:none}}
@media (max-width:440px){.logo .name{display:none}.top .wrap{gap:10px}.lang button{padding:6px 7px}}

/* hero */
.hero{position:relative;overflow:hidden;padding-block:clamp(40px,7vw,90px) clamp(48px,7vw,96px)}
.blobs{position:absolute;inset:0;pointer-events:none;z-index:0}
.blob{position:absolute;border-radius:50%;filter:blur(50px);opacity:.55;transform:translate(calc(var(--mx,0)*var(--d)),calc(var(--my,0)*var(--d)))}
.blob i{display:block;width:100%;height:100%;border-radius:inherit;background:var(--c);animation:float var(--t) ease-in-out infinite alternate}
.b1{width:340px;height:340px;left:-80px;top:-60px;--c:var(--jade);--t:9s;--d:30px}
.b2{width:280px;height:280px;right:6%;top:10%;--c:var(--pink);--t:11s;--d:-40px}
.b3{width:240px;height:240px;left:40%;bottom:-90px;--c:var(--sun);--t:8s;--d:50px}
.b4{width:200px;height:200px;right:-50px;bottom:0;--c:var(--lilac);--t:12s;--d:-25px}
@keyframes float{from{transform:translate(0,0) scale(1)}to{transform:translate(40px,30px) scale(1.15)}}
.hero .wrap{position:relative;z-index:1;display:grid;grid-template-columns:1.1fr .9fr;gap:clamp(32px,5vw,72px);align-items:center}
.hero h1{font-size:clamp(38px,6.2vw,74px);font-weight:800;letter-spacing:-.03em}
.hero h1 .l2{display:block;background:linear-gradient(90deg,var(--jade),var(--lilac),var(--pink),var(--jade));background-size:300% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:shine 8s linear infinite}
@keyframes shine{to{background-position:300% 0}}
.hero-text{display:grid;gap:22px;min-width:0}
.typed{font:600 clamp(18px,2.2vw,23px)/1.4 var(--f-body);min-height:2.8em}
.typed .word{display:inline-block;padding:0 8px;border-radius:8px;background:var(--sun);color:#2A1A00;font-weight:800}
.typed .caret{display:inline-block;width:2px;height:1.1em;vertical-align:-3px;margin-left:2px;background:var(--ink);animation:blink 1s steps(1) infinite}
@keyframes blink{50%{opacity:0}}
.hero-actions{display:flex;flex-wrap:wrap;gap:14px}
@media (max-width:880px){.hero .wrap{grid-template-columns:1fr}}

/* live card */
.stage{perspective:1000px;justify-self:center;width:100%;max-width:460px}
.medcard{position:relative;background:var(--surface);border:2px solid var(--line);border-radius:var(--r-lg);padding:24px;box-shadow:var(--shadow);display:grid;gap:16px;transform:rotateX(var(--rx,0deg)) rotateY(var(--ry,0deg));transition:transform 400ms var(--ease);transform-style:preserve-3d}
.medcard::before{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;background:radial-gradient(260px circle at var(--gx,50%) var(--gy,0%),color-mix(in srgb,var(--jade) 18%,transparent),transparent 70%)}
.sticker{position:absolute;top:-16px;right:22px;transform:rotate(6deg);background:var(--pink);color:#2A0A1C;font:800 13px var(--f-body);padding:6px 12px;border-radius:999px;box-shadow:0 4px 0 color-mix(in srgb,var(--pink) 55%,var(--ink))}
.medcard-head{display:flex;justify-content:space-between;align-items:center;gap:12px}
.who{font-weight:800;font-size:19px}
.sub{color:var(--muted);font-size:14px}
.bpm{display:inline-flex;align-items:center;gap:6px;font:800 14px var(--f-body);padding:5px 11px;border-radius:999px;background:var(--soft);color:var(--jade-strong);white-space:nowrap;font-variant-numeric:tabular-nums}
.heart{animation:beat var(--beat,.83s) ease-in-out infinite;transform-origin:center}
@keyframes beat{0%,100%{transform:scale(1)}15%{transform:scale(1.25)}30%{transform:scale(.95)}45%{transform:scale(1.12)}}
.pulse{width:100%;height:70px;display:block}
.pulse path{fill:none;stroke-linecap:round;stroke-linejoin:round}
.pulse .ghost{stroke:var(--line);stroke-width:1.5}
.pulse .trace{stroke:var(--jade);stroke-width:3;stroke-dasharray:640;animation:trace var(--trace,3s) linear infinite}
@keyframes trace{0%{stroke-dashoffset:640}50%{stroke-dashoffset:0}100%{stroke-dashoffset:-640}}
.medcard-body{display:grid;grid-template-columns:1fr auto;gap:16px;align-items:end}
.kv{display:grid;gap:8px;margin:0}
.kv div{display:grid;gap:0}
.kv dt{font-size:13px;color:var(--muted)}
.kv dd{margin:0;font-weight:800}
.kv dd.flash{animation:flash 600ms var(--ease)}
@keyframes flash{0%{background:var(--sun);color:#2A1A00}100%{background:transparent}}
.mini-qr{background:var(--qr-bg);padding:8px;border-radius:var(--r-sm);border:2px solid var(--line);line-height:0}
.mini-qr svg{width:100px;height:100px}
.playground{display:grid;gap:10px;padding-top:14px;border-top:2px dashed var(--line)}
.playground .lbl{font-size:14px;font-weight:700;color:var(--muted)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:2px solid var(--line);background:transparent;color:var(--ink);font:800 13px var(--f-body);padding:6px 10px;border-radius:999px;cursor:pointer;transition:transform var(--dur) var(--spring),background var(--dur-fast),border-color var(--dur-fast)}
.chip:hover{transform:translateY(-2px);border-color:var(--jade)}
.chip[aria-pressed="true"]{background:var(--jade);border-color:var(--jade);color:var(--on-jade)}
.bpm-ctl{display:grid;grid-template-columns:auto 1fr;gap:12px;align-items:center}
input[type=range]{padding:0;border:0;background:transparent;accent-color:var(--pink);width:100%}

/* marquee */
.marquee{overflow:hidden;background:var(--ink);color:var(--bg);padding-block:14px;transform:rotate(-1.5deg);margin-inline:-10px;position:relative;z-index:2}
.track{display:flex;gap:28px;width:max-content;animation:scroll 32s linear infinite;font:700 clamp(16px,2vw,22px) var(--f-display)}
.track span{display:flex;align-items:center;gap:28px;white-space:nowrap}
.track span::after{content:"";width:12px;height:12px;border-radius:50%;background:var(--sun)}
.track span:nth-child(3n+2)::after{background:var(--pink)}
.track span:nth-child(3n)::after{background:var(--jade)}
.marquee:hover .track{animation-play-state:paused}
@keyframes scroll{to{transform:translateX(-50%)}}

/* stats */
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:20px;padding-block:clamp(56px,7vw,88px) 0}
.stat{display:grid;gap:6px;padding:22px 24px;border-radius:var(--r-lg);border:2px solid var(--line);background:var(--surface);transition:transform var(--dur) var(--spring)}
.stat:hover{transform:translateY(-6px) rotate(-1deg)}
.stat b{font:800 clamp(44px,6vw,68px)/1 var(--f-display);font-variant-numeric:tabular-nums}
.stat:nth-child(1) b{color:var(--jade)}
.stat:nth-child(2) b{color:var(--pink)}
.stat:nth-child(3) b{color:var(--lilac)}
.stat span{color:var(--muted);font-weight:600}
@media (max-width:700px){.stats{grid-template-columns:1fr}}

/* sections */
section.block{padding-block:clamp(56px,8vw,104px)}
.block-head{display:grid;gap:14px;margin-bottom:clamp(28px,4vw,48px);max-width:780px}
.about-grid{display:grid;grid-template-columns:1fr 1fr;gap:20px}
.about-card{display:grid;gap:12px;align-content:start;padding:28px;border-radius:var(--r-lg);min-width:0}
.about-card.problem{background:color-mix(in srgb,var(--pink) 16%,var(--surface))}
.about-card.solution{background:color-mix(in srgb,var(--jade) 16%,var(--surface))}
.about-card .em{font-size:34px;line-height:1}
.about-card p{color:var(--muted)}
.quote{grid-column:1/-1;padding:28px;border-radius:var(--r-lg);background:var(--ink);color:var(--bg);font:500 clamp(18px,2.2vw,24px)/1.45 var(--f-display);max-width:none}
@media (max-width:760px){.about-grid{grid-template-columns:1fr}}

.features{display:grid;grid-template-columns:repeat(2,1fr);gap:16px}
.feature{position:relative;overflow:hidden;display:grid;grid-template-columns:56px 1fr;gap:18px;padding:26px;border-radius:var(--r-lg);border:2px solid var(--line);background:var(--surface);min-width:0;transition:transform var(--dur) var(--spring),border-color var(--dur)}
.feature::before{content:"";position:absolute;inset:0;pointer-events:none;opacity:0;transition:opacity var(--dur);background:radial-gradient(300px circle at var(--x,50%) var(--y,50%),color-mix(in srgb,var(--c) 28%,transparent),transparent 65%)}
.feature:hover{transform:translateY(-4px);border-color:var(--c)}
.feature:hover::before{opacity:1}
.feature > *{position:relative}
.feature p{color:var(--muted);margin-top:6px}
.feature:nth-child(1){--c:var(--jade)}.feature:nth-child(2){--c:var(--pink)}.feature:nth-child(3){--c:var(--sun)}.feature:nth-child(4){--c:var(--lilac)}
.ico{width:56px;height:56px;border-radius:18px;background:var(--c);display:grid;place-items:center;color:#1B0F30;transition:transform 500ms var(--spring)}
.feature:hover .ico{transform:rotate(-12deg) scale(1.1)}
.ico svg{width:26px;height:26px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
@media (max-width:760px){.features{grid-template-columns:1fr}}

.steps{position:relative;display:grid;grid-template-columns:repeat(3,1fr);gap:20px;list-style:none;padding:0;margin:0;counter-reset:s}
.steps::before{content:"";position:absolute;top:44px;left:8%;right:8%;height:4px;border-radius:4px;background:var(--line)}
.steps::after{content:"";position:absolute;top:44px;left:8%;right:8%;height:4px;border-radius:4px;background:linear-gradient(90deg,var(--jade),var(--pink));transform-origin:left;transform:scaleX(var(--sp,1));transition:transform 200ms linear}
.step{position:relative;z-index:1;display:grid;gap:10px;justify-items:start;padding:0 8px}
.step::before{counter-increment:s;content:counter(s);display:grid;place-items:center;width:88px;height:88px;border-radius:50%;background:var(--surface);border:4px solid var(--line);font:800 36px/1 var(--f-display);color:var(--muted);transition:all 500ms var(--spring)}
.step.lit::before{border-color:var(--jade);background:var(--jade);color:var(--on-jade);transform:scale(1.06) rotate(-6deg)}
.step p{color:var(--muted)}
@media (max-width:760px){.steps{grid-template-columns:1fr}.steps::before,.steps::after{display:none}}

/* account */
.account{background:var(--ink);color:var(--bg);border-radius:var(--r-lg) var(--r-lg) 0 0;position:relative;overflow:hidden}
.account .wrap{position:relative;z-index:1}
.account::before{content:"";position:absolute;width:420px;height:420px;right:-120px;top:-140px;border-radius:50%;background:var(--jade);filter:blur(80px);opacity:.35;animation:float 10s ease-in-out infinite alternate}
.account::after{content:"";position:absolute;width:300px;height:300px;left:-100px;bottom:-100px;border-radius:50%;background:var(--pink);filter:blur(80px);opacity:.3;animation:float 13s ease-in-out infinite alternate-reverse}
.account .lead{color:color-mix(in srgb,var(--bg) 78%,transparent)}
.panel{background:var(--surface);color:var(--ink);border-radius:var(--r-lg);padding:clamp(20px,3vw,36px);box-shadow:var(--shadow)}
.auth{max-width:540px}
.tabs{position:relative;display:grid;grid-template-columns:1fr 1fr;padding:4px;background:var(--bg);border-radius:999px;margin-bottom:24px;max-width:340px}
.tabs .pill{position:absolute;top:4px;bottom:4px;left:4px;width:calc(50% - 4px);border-radius:999px;background:var(--jade);transition:transform 400ms var(--spring)}
.tabs[data-login="true"] .pill{transform:translateX(100%)}
.tabs button{position:relative;border:0;background:transparent;color:var(--muted);font:800 15px var(--f-body);padding:10px 14px;border-radius:999px;cursor:pointer;transition:color var(--dur)}
.tabs button[aria-selected="true"]{color:var(--on-jade)}
form{display:grid;gap:16px}
form.enter{animation:pop 420ms var(--spring)}
@keyframes pop{from{opacity:.3;transform:translateY(10px) scale(.98)}to{opacity:1;transform:none}}
.field{display:grid;gap:6px;min-width:0}
.field label{font-weight:800;font-size:15px}
.field .hint{font-size:13px;color:var(--muted)}
input,select,textarea{font:inherit;font-size:16px;color:var(--ink);background:var(--bg);border:2px solid var(--line);border-radius:var(--r-sm);padding:11px 14px;width:100%;transition:border-color var(--dur-fast),box-shadow var(--dur-fast)}
textarea{resize:vertical;min-height:70px}
input:hover,select:hover,textarea:hover{border-color:var(--muted)}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--jade);box-shadow:0 0 0 4px color-mix(in srgb,var(--jade) 25%,transparent)}
.field.invalid input{border-color:var(--danger);animation:shake 360ms}
@keyframes shake{25%{transform:translateX(-6px)}50%{transform:translateX(5px)}75%{transform:translateX(-3px)}}
.err{color:var(--danger);font-size:14px;font-weight:600}
.err:empty{display:none}
.form-note{font-size:14px;color:var(--muted)}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:16px}
@media (max-width:560px){.row2{grid-template-columns:1fr}}
.pw{position:relative}
.pw input{padding-right:52px}
.pw button{position:absolute;right:6px;top:50%;transform:translateY(-50%);width:38px;height:38px;border:0;background:transparent;color:var(--muted);cursor:pointer;border-radius:8px}
.pw button svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:2}
.meter{height:6px;border-radius:6px;background:var(--line);overflow:hidden}
.meter i{display:block;height:100%;width:var(--w,0%);background:var(--mc,var(--danger));transition:width var(--dur) var(--ease),background var(--dur)}

.workspace{display:grid;grid-template-columns:1.25fr .75fr;gap:24px;align-items:start}
.workspace > *{min-width:0}
.ws-head{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:12px;margin-bottom:8px}
.ws-head h3{font-size:22px}
.complete{display:grid;gap:6px;margin-bottom:20px}
.complete .row{display:flex;justify-content:space-between;font-size:14px;font-weight:700;color:var(--muted)}
.complete .bar{height:10px;border-radius:10px;background:var(--bg);overflow:hidden}
.complete .bar i{display:block;height:100%;width:var(--w,0%);border-radius:inherit;background:linear-gradient(90deg,var(--jade),var(--sun),var(--pink));transition:width 500ms var(--spring)}
fieldset{border:0;padding:0;margin:0;display:grid;gap:10px}
legend{font-weight:800;font-size:15px;margin-bottom:8px}
.checks{display:flex;flex-wrap:wrap;gap:8px}
.check{display:inline-flex;align-items:center;gap:8px;padding:7px 12px;border:2px solid var(--line);border-radius:999px;font-size:14px;font-weight:700;cursor:pointer;user-select:none;transition:transform var(--dur) var(--spring),background var(--dur-fast),border-color var(--dur-fast)}
.check:hover{transform:translateY(-2px)}
.check input{width:16px;height:16px;padding:0;accent-color:var(--jade)}
.check:has(input:checked){border-color:var(--jade);background:var(--soft)}
.qr-panel{position:sticky;top:92px;display:grid;gap:16px;justify-items:center;text-align:center}
.qr-frame{position:relative;background:var(--qr-bg);padding:14px;border-radius:var(--r-md);border:6px solid var(--frame,var(--jade));line-height:0;overflow:hidden;transition:border-color var(--dur),transform 500ms var(--spring)}
.qr-frame:hover{transform:rotate(-2deg) scale(1.03)}
.qr-frame svg{display:block}
.qr-frame.scan svg{animation:reveal 800ms var(--ease) both}
.qr-frame.scan::after{content:"";position:absolute;left:0;right:0;height:4px;background:var(--pink);box-shadow:0 0 14px var(--pink);top:0;animation:scanline 800ms var(--ease) both}
@keyframes reveal{from{clip-path:inset(0 0 100% 0)}to{clip-path:inset(0 0 0 0)}}
@keyframes scanline{from{top:0;opacity:1}to{top:100%;opacity:0}}
.qr-meta{font-size:14px;color:var(--muted);font-variant-numeric:tabular-nums}
.ctl{display:grid;gap:6px;width:100%;max-width:250px;text-align:left}
.ctl > label,.ctl > .lbl{font-size:14px;font-weight:800;display:flex;justify-content:space-between}
.swatches{display:flex;gap:8px}
.swatch{width:32px;height:32px;border-radius:50%;border:3px solid var(--surface);outline:2px solid var(--line);background:var(--c);cursor:pointer;transition:transform var(--dur) var(--spring)}
.swatch:hover{transform:scale(1.15)}
.swatch[aria-pressed="true"]{outline-color:var(--ink);transform:scale(1.12)}
.saved{font-size:14px;font-weight:700;color:var(--jade-strong);min-height:20px}

/* FAQ */
.faq{display:grid;gap:10px;max-width:860px}
details{border:2px solid var(--line);border-radius:var(--r-md);background:var(--surface);transition:border-color var(--dur)}
details[open]{border-color:var(--jade)}
summary{list-style:none;cursor:pointer;padding:18px 20px;font-weight:800;font-size:18px;display:flex;justify-content:space-between;gap:16px;align-items:center}
summary::-webkit-details-marker{display:none}
summary .plus{flex:none;width:30px;height:30px;border-radius:50%;background:var(--soft);position:relative;transition:transform 400ms var(--spring),background var(--dur)}
summary .plus::before,summary .plus::after{content:"";position:absolute;left:50%;top:50%;width:12px;height:2px;background:var(--jade-strong);transform:translate(-50%,-50%)}
summary .plus::after{transform:translate(-50%,-50%) rotate(90deg)}
details[open] summary .plus{transform:rotate(135deg);background:var(--sun)}
details p{padding:0 20px 20px;color:var(--muted);max-width:65ch}
details[open] p{animation:pop 360ms var(--ease)}

footer{background:var(--ink);color:color-mix(in srgb,var(--bg) 70%,transparent);padding-block:28px;font-size:14px}
footer .wrap{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:12px 24px}

/* load sequence */
.hero-text > *{animation:rise 800ms var(--spring) both}
.hero-text > *:nth-child(2){animation-delay:90ms}
.hero-text > *:nth-child(3){animation-delay:180ms}
.hero-text > *:nth-child(4){animation-delay:270ms}
.stage{animation:drop 1000ms 250ms var(--spring) both}
@keyframes rise{from{transform:translateY(20px);opacity:.001}to{transform:none;opacity:1}}
@keyframes drop{from{transform:translateY(-30px) rotate(4deg);opacity:.001}to{transform:none;opacity:1}}
/* reveal on scroll: JS adds .rv only to blocks below the fold, then .in when they enter */
.rv{opacity:0;translate:0 32px;scale:.985;filter:blur(6px);
  transition:opacity 900ms cubic-bezier(.16,1,.3,1),translate 1000ms cubic-bezier(.16,1,.3,1),scale 1000ms cubic-bezier(.16,1,.3,1),filter 900ms cubic-bezier(.16,1,.3,1)!important;
  transition-delay:var(--rd,0ms)!important}
.rv.in{opacity:1;translate:none;scale:none;filter:none}
.i18n-swap{animation:swap 400ms var(--ease)}
@keyframes swap{from{opacity:.2;filter:blur(4px)}to{opacity:1;filter:none}}

.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translate(-50%,30px) scale(.9);background:var(--jade);color:var(--on-jade);padding:12px 20px;border-radius:999px;font-weight:800;opacity:0;pointer-events:none;transition:opacity var(--dur),transform 400ms var(--spring);z-index:30;max-width:calc(100% - 32px);box-shadow:var(--shadow)}
.toast.show{opacity:1;transform:translate(-50%,0) scale(1)}
#confetti{position:fixed;inset:0;pointer-events:none;z-index:40;width:100%;height:100%}

/* bracelet */
.bracelet{padding-top:clamp(64px,8vw,104px)}
.br-grid{display:grid;grid-template-columns:1.15fr .85fr;gap:24px;align-items:start}
.br-grid > *{min-width:0}
.br-stage{position:relative;height:clamp(360px,42vw,520px);border-radius:var(--r-lg);overflow:hidden;border:2px solid var(--line);
  background:radial-gradient(120% 90% at 30% 20%,color-mix(in srgb,var(--jade) 30%,var(--surface)),transparent 60%),radial-gradient(90% 80% at 85% 90%,color-mix(in srgb,var(--pink) 28%,var(--surface)),transparent 60%),var(--surface)}
.br-stage canvas{position:absolute;inset:0;width:100%;height:100%;display:block;cursor:grab;touch-action:pan-y}
.br-stage canvas:active{cursor:grabbing}
.br-stage canvas:focus-visible{outline:3px solid var(--pink);outline-offset:-6px}
.br-hint{position:absolute;left:16px;bottom:16px;right:120px;font-size:14px;font-weight:700;color:var(--muted);pointer-events:none}
.br-tools{position:absolute;right:14px;bottom:14px;display:flex;gap:8px}
.br-fallback{position:absolute;inset:0;display:grid;place-items:center;padding:24px;text-align:center;font-weight:700;color:var(--muted)}
.br-tag{position:absolute;left:16px;top:16px;background:var(--ink);color:var(--bg);font:800 13px var(--f-body);padding:6px 12px;border-radius:999px;pointer-events:none}
.icon-btn[aria-pressed="true"]{background:var(--jade);border-color:var(--jade);color:var(--on-jade)}
.br-side{display:grid;gap:18px;align-content:start}
.br-controls{display:grid;gap:18px;padding:24px;border-radius:var(--r-lg);background:var(--surface);border:2px solid var(--line)}
.br-controls .lbl{font-size:14px;font-weight:800}
.br-controls .grp{display:grid;gap:8px}
.specs{margin:0;display:grid;gap:0;border-top:2px solid var(--line)}
.specs div{display:grid;grid-template-columns:110px 1fr;gap:12px;padding:12px 0;border-bottom:2px solid var(--line)}
.specs dt{font-weight:800;font-size:15px}
.specs dd{margin:0;color:var(--muted);font-size:15px}
@media (max-width:900px){.br-grid{grid-template-columns:1fr}.br-stage{height:380px}}
@media (max-width:440px){.specs div{grid-template-columns:1fr;gap:2px}}

/* emergency card view */
body.card-mode main, body.card-mode footer, body.card-mode nav.links{display:none}
.cardview{position:relative;overflow:hidden;padding-block:clamp(28px,5vw,64px) clamp(48px,6vw,80px);min-height:70vh}
.cardview .blobs .blob{opacity:.4}
.cardview .wrap{position:relative;z-index:1;display:grid;gap:20px;justify-items:center}
.ecard{width:100%;max-width:560px;background:var(--surface);border:2px solid var(--line);border-radius:var(--r-lg);box-shadow:var(--shadow);overflow:hidden;animation:cardin 700ms var(--spring) both}
@keyframes cardin{from{opacity:.001;transform:translateY(30px) scale(.96) rotate(-1.5deg)}to{opacity:1;transform:none}}
.ecard-top{position:relative;background:var(--pink);color:#2A0A1C;padding:24px 24px 28px;display:grid;gap:8px}
.ecard-top h1{font-size:clamp(26px,6vw,38px);font-weight:800;overflow-wrap:anywhere}
.ecard-badge{display:inline-flex;align-items:center;gap:8px;width:max-content;max-width:100%;font-weight:800;font-size:14px;background:#FFFFFF;color:#2A0A1C;padding:5px 12px;border-radius:999px}
.ecard-badge svg{width:14px;height:14px}
.cv-age{font-weight:700;opacity:.85}
.ecard-sec{padding:20px 24px;display:grid;gap:4px;border-top:2px solid var(--line)}
.ecard-sec:first-of-type{border-top:0}
.ecard-sec > span{font-size:14px;font-weight:800;color:var(--muted)}
.ecard-sec p{font-weight:700;font-size:18px;overflow-wrap:anywhere}
.ecard-blood{display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap}
.ecard-blood b{font:800 clamp(30px,8vw,46px)/1 var(--f-display);color:var(--jade-strong)}
.ecard-alert{background:color-mix(in srgb,var(--sun) 35%,var(--surface))}
.ecard-alert.none{background:transparent}
.cv-phone{font-variant-numeric:tabular-nums;user-select:all}
.ecard-call .btn{justify-self:start;margin-top:8px}
.ecard .form-note{padding:16px 24px 22px;border-top:2px solid var(--line)}
.cv-actions{display:flex;flex-wrap:wrap;gap:12px;justify-content:center}
.sample-flag{font-size:13px;font-weight:800;background:var(--ink);color:var(--bg);padding:3px 10px;border-radius:999px;width:max-content}

/* ---------- refresh layer: calmer, product-grade look ---------- */
:root{
  --bg:#F3F7F5; --surface:#FFFFFF; --ink:#0F1F1A; --muted:#55665F; --line:#DCE6E1; --soft:#E3F3EB;
  --jade:#00A878; --jade-strong:#007A57;
  --f-display:"Unbounded","Manrope","Segoe UI",system-ui,sans-serif;
  --f-body:"Manrope","Segoe UI",system-ui,-apple-system,sans-serif;
  --r-sm:10px; --r-md:14px; --r-lg:22px;
  --shadow:0 1px 2px rgba(15,31,26,.05),0 24px 48px -28px rgba(15,31,26,.35);
  /* hero is a fixed dark "studio" band in both themes */
  --hero-bg:#081310; --hero-bg2:#0E211C; --hero-ink:#ECF8F3; --hero-muted:#9DB5AD; --hero-line:rgba(236,248,243,.14); --hero-card:#0F1E1A; --hero-accent:#2EE6A6;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0A1311; --surface:#111D1A; --ink:#E9F5F0; --muted:#9AB0A8; --line:#20322D; --soft:#14302A;
  --jade:#2EE6A6; --jade-strong:#7AF5C8;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 24px 48px -24px rgba(0,0,0,.8);}}
:root[data-theme="dark"]{
  --bg:#0A1311; --surface:#111D1A; --ink:#E9F5F0; --muted:#9AB0A8; --line:#20322D; --soft:#14302A;
  --jade:#2EE6A6; --jade-strong:#7AF5C8;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 24px 48px -24px rgba(0,0,0,.8);}
body{margin:0;font:500 16px/1.6 var(--f-body)}
h1,h2{font-weight:600;letter-spacing:-.03em;line-height:1.08}
h2{font-size:clamp(26px,3.4vw,42px)}
h3{font-family:var(--f-body);font-size:18px;font-weight:700;letter-spacing:-.01em}
.lead{font-size:clamp(16px,1.6vw,19px)}
:focus-visible{outline:2px solid var(--jade);outline-offset:3px}

.btn{border-width:1px;font:700 15px/1 var(--f-body);letter-spacing:-.005em;transition:transform var(--dur) var(--ease),background var(--dur-fast),border-color var(--dur-fast),box-shadow var(--dur)}
.btn-primary{box-shadow:0 10px 28px -14px var(--jade)}
.btn-primary:hover{box-shadow:0 14px 34px -14px var(--jade);filter:brightness(1.05)}
.btn-pink{box-shadow:none}
.btn-ghost{border-color:var(--line)}
.btn-ghost:hover{border-color:var(--ink);background:transparent}
.icon-btn{border-width:1px;border-radius:12px}
.icon-btn:hover{transform:none;border-color:var(--ink)}
.lang{border-width:1px;border-radius:12px}
.lang button{font:700 12px var(--f-body);letter-spacing:.04em}
header.top{background:color-mix(in srgb,var(--bg) 80%,transparent);backdrop-filter:saturate(1.4) blur(14px)}
.progress{height:2px;background:var(--jade)}
nav.links a{font-weight:600;font-size:14px}
nav.links a::after{height:1px;background:var(--ink)}

/* hero */
.hero{isolation:isolate;background:radial-gradient(70% 60% at 72% 45%,var(--hero-bg2),transparent 70%),var(--hero-bg);color:var(--hero-ink);
  min-height:max(600px,calc(100vh - var(--head-h,68px)));display:grid;align-items:center;padding-block:clamp(32px,5vw,64px)}
.hero-scroll{position:relative}
.hero-scroll.pinned .hero{position:sticky}
.scroll-hint{position:absolute;left:50%;bottom:22px;z-index:3;transform:translateX(-50%);display:flex;align-items:center;gap:10px;font-size:13px;font-weight:600;color:var(--hero-muted);pointer-events:none;transition:opacity 400ms var(--ease)}
.scroll-hint.gone{opacity:0}
.scroll-hint .mouse{width:20px;height:30px;border:1.5px solid var(--hero-muted);border-radius:10px;position:relative}
.scroll-hint .mouse::after{content:"";position:absolute;left:50%;top:6px;width:3px;height:6px;margin-left:-1.5px;border-radius:2px;background:var(--hero-accent);animation:wheel 1.6s var(--ease) infinite}
@keyframes wheel{0%{transform:translateY(0);opacity:1}100%{transform:translateY(9px);opacity:0}}
.hero.no3d .scroll-hint{display:none}
.hero::before{content:"";position:absolute;inset:0;z-index:0;pointer-events:none;opacity:.5;
  background-image:radial-gradient(var(--hero-line) 1px,transparent 1.2px);background-size:28px 28px;
  -webkit-mask-image:radial-gradient(60% 70% at 70% 50%,#000,transparent 75%);mask-image:radial-gradient(60% 70% at 70% 50%,#000,transparent 75%)}
.hero-canvas{position:absolute;inset:0;width:100%;height:100%;z-index:0;display:block}
.hero-lines{position:absolute;inset:0;width:100%;height:100%;z-index:1;pointer-events:none;overflow:visible}
.hero-lines line{stroke:var(--hero-line);stroke-width:1;transition:stroke var(--dur)}
.hero-lines circle{fill:var(--hero-bg);stroke-width:1.5}
.hero-labels{position:absolute;inset:0;z-index:2;pointer-events:none}
.xlabel{position:absolute;left:0;top:0;width:220px;display:grid;gap:4px;padding:12px 14px;border-radius:12px;background:var(--hero-card);border:1px solid var(--hero-line);
  opacity:0;visibility:hidden;transition:border-color 400ms var(--ease);will-change:transform,opacity}
.xlabel b{display:flex;align-items:center;gap:8px;font:700 14px/1.2 var(--f-body);color:var(--hero-ink)}
.xlabel b::before{content:"";flex:none;width:8px;height:8px;border-radius:50%;background:var(--c);box-shadow:0 0 0 4px color-mix(in srgb,var(--c) 22%,transparent)}
.xlabel span{font-size:13px;line-height:1.45;color:var(--hero-muted)}
.xlabel.on{border-color:color-mix(in srgb,var(--c) 55%,transparent)}
.hero .wrap{z-index:3;grid-template-columns:minmax(0,1fr) minmax(0,1.05fr);align-items:stretch;width:100%;pointer-events:none}
.hero .wrap a,.hero .wrap button{pointer-events:auto}
.hero-text{align-content:center;gap:20px;max-width:560px}
.eyebrow{display:inline-flex;align-items:center;gap:10px;width:max-content;max-width:100%;padding:6px 14px 6px 10px;border:1px solid var(--hero-line);border-radius:999px;font-size:13px;font-weight:600;color:var(--hero-muted)}
.eyebrow i{width:8px;height:8px;border-radius:50%;background:var(--hero-accent);box-shadow:0 0 0 0 var(--hero-accent);animation:ping 2.4s var(--ease) infinite}
@keyframes ping{0%{box-shadow:0 0 0 0 color-mix(in srgb,var(--hero-accent) 60%,transparent)}100%{box-shadow:0 0 0 10px transparent}}
.hero h1{font-size:clamp(34px,4.9vw,64px);font-weight:600;letter-spacing:-.035em;color:var(--hero-ink)}
.hero h1 .l2{background:linear-gradient(90deg,var(--hero-accent),#22C8FF,#DCE6FF,var(--hero-accent));background-size:300% 100%;-webkit-background-clip:text;background-clip:text;animation-duration:14s}
.hero .typed{font:600 clamp(16px,1.8vw,20px)/1.45 var(--f-body);color:var(--hero-ink)}
.hero .typed .word{background:color-mix(in srgb,var(--hero-accent) 16%,transparent);color:var(--hero-accent);border-radius:6px}
.hero .typed .caret{background:var(--hero-ink)}
.hero .lead{color:var(--hero-muted)}
.hero .btn-primary{background:var(--hero-accent);color:#FFFFFF;box-shadow:0 12px 36px -14px var(--hero-accent)}
.hero .btn-ghost{color:var(--hero-ink);border-color:var(--hero-line)}
.hero .btn-ghost:hover{border-color:var(--hero-ink)}
.hero-visual{position:relative;min-height:clamp(420px,46vw,600px)}
.parts{position:absolute;left:0;right:0;bottom:0;display:flex;flex-wrap:wrap;justify-content:center;gap:8px}
.pchip{display:inline-flex;align-items:center;gap:8px;min-height:36px;padding:0 14px;border-radius:999px;border:1px solid var(--hero-line);background:color-mix(in srgb,var(--hero-bg) 70%,transparent);color:var(--hero-muted);font:600 13px var(--f-body);cursor:pointer;transition:color var(--dur-fast),border-color var(--dur-fast),background var(--dur-fast)}
.pchip i{width:8px;height:8px;border-radius:50%;background:var(--c)}
.pchip:hover{color:var(--hero-ink);border-color:color-mix(in srgb,var(--hero-ink) 40%,transparent)}
.pchip[aria-pressed="true"]{color:var(--hero-ink);border-color:var(--c);background:color-mix(in srgb,var(--c) 14%,var(--hero-bg))}
.hero.no3d .hero-visual,.hero.no3d .hero-labels{display:none}
.hero.no3d .wrap{grid-template-columns:1fr}
@media (max-width:880px){
  .hero{min-height:0;align-items:start}
  .scroll-hint{display:none}
  .hero .wrap{grid-template-columns:1fr;gap:8px}
  .hero-visual{min-height:clamp(440px,110vw,560px)}
  .xlabel{width:200px;padding:10px 12px}
}

/* demo card */
.demo-grid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:clamp(28px,5vw,72px);align-items:center}
.demo-grid .block-head{margin:0}
@media (max-width:880px){.demo-grid{grid-template-columns:1fr}}
.medcard{border-width:1px}
.sticker{transform:none;box-shadow:none;font:700 12px var(--f-body);letter-spacing:.02em}
.mini-qr,.chip{border-width:1px}
.chip{font:700 13px var(--f-body)}
.chip:hover{transform:none}

/* surfaces */
.marquee{transform:none;margin-inline:0;background:var(--surface);color:var(--muted);border-block:1px solid var(--line);padding-block:16px}
.track{font:600 13px var(--f-body);letter-spacing:.12em;text-transform:uppercase;animation-duration:44s}
.track span::after{width:6px;height:6px}
.stat,.feature,details,.br-controls,.br-stage{border-width:1px}
.stat:hover{transform:translateY(-3px)}
.stat b{font-weight:600;letter-spacing:-.04em}
.feature:hover{transform:translateY(-3px)}
.ico{width:48px;height:48px;border-radius:14px;background:color-mix(in srgb,var(--c) 18%,var(--surface));color:var(--ink)}
.feature{grid-template-columns:48px 1fr}
.feature:hover .ico{transform:none}
.about-card{border:1px solid var(--line)}
.about-card.problem{background:color-mix(in srgb,var(--pink) 8%,var(--surface))}
.about-card.solution{background:color-mix(in srgb,var(--jade) 8%,var(--surface))}
.quote{font:600 clamp(18px,2vw,22px)/1.5 var(--f-body);letter-spacing:-.01em}
.step::before{border-width:2px;width:72px;height:72px;font:600 26px/1 var(--f-display)}
.step.lit::before{transform:none}
.steps::before,.steps::after{top:36px;height:2px}
.specs,.specs div{border-width:1px}
summary{font-weight:700;font-size:17px}
input,select,textarea{border-width:1px}
.tabs button{font:700 14px var(--f-body)}
.typed .word{font-weight:700}
.qr-frame:hover{transform:none}
.swatch:hover{transform:scale(1.08)}

/* headings rise out of a mask */


/* ---------- palette: smoky black + electric blue (single dark look) ---------- */
:root:is([data-theme],:not([data-theme])){
  --bg:#0D0E10; --surface:#15171A; --ink:#ECEFF4; --muted:#8E96A3; --line:#272A30; --soft:#162140;
  --jade:#2F6BFF; --jade-strong:#7FA6FF; --on-jade:#FFFFFF;
  --pink:#22C8FF; --sun:#9DBBFF; --lilac:#5C6CFF; --danger:#FF6B6B;
  --qr-bg:#FFFFFF; --qr-fg:#0D0E10;
  --shadow:0 1px 2px rgba(0,0,0,.5),0 28px 60px -30px rgba(0,0,0,.9);
  --hero-bg:#0A0B0D; --hero-bg2:#101a3a; --hero-ink:#EEF1F6; --hero-muted:#8E96A3; --hero-line:rgba(238,241,246,.12); --hero-card:#121418; --hero-accent:#3D7BFF;
  color-scheme:dark}
#themeBtn{display:none}
